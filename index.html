<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Profissional</title>
    <style>
     
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

    
        body {
            
            background-color: #f0f2f5; 
            display: flex;
            justify-content: center;
            align-items: center;
           
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            color: #333;
        }

        .main-wrapper {
            display: flex;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
            max-width: 900px; 
            width: 90%; 
            overflow: hidden; 
        }

        .image-section {
            flex: 1; 
            min-width: 350px; 
            background-color: #e0e7ee; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-section img {
            width: 100%;
            height: 100%;

        }

        .login-section {
            flex: 1; 
            padding: 40px 30px;
            display: flex;
            
        }

        .login-section h2 {
            color: #4d5aa7; 
            margin-bottom: 30px;
            font-size: 1.8em;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9em;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #020a3b; 
            box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.2);
        }

        /* Botão de Envio */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #495079;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.1s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #373e6b; 
        }
        
        .submit-btn:active {
            transform: scale(0.99);
        }

        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column; 
                max-width: 400px;
            }

            .image-section {
                display: none; 
            }

            .login-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="image-section">
            <img 
                src="leao.jpg" 
                alt="Imagem de Fundo Decorativa" 
                onerror="this.style.display='none'" 
            >
        </div>

        <div class="login-section">
            <h2>Bem-Vindo!</h2>
            <form action="#" method="post" class="login-form">
                
                <div class="input-group">
                    <label for="username">Usuário (E-mail ou Nome)</label>
                    <input 
                        type="email" 
                        name="username" 
                        id="username" 
                        required
                    >
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                    >
                </div>
                
                <button type="submit" class="submit-btn">Entrar</button>

            </form>
        </div>
    </div>
</body>
</html>
